version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - durationcheck
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - wastedassign
    - whitespace
  settings:
    govet:
      enable:
        - shadow
    staticcheck:
      checks:
        - all
        # Domain and CLI errors deliberately preserve their user-facing names.
        - -ST1005
        # Type spelling and quick-fix suggestions are style-only churn.
        - -ST1023
        - -QF*
  exclusions:
    generated: strict

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: github.com/ob-labs/powercontext-go
    goimports:
      local-prefixes:
        - github.com/ob-labs/powercontext-go
  exclusions:
    generated: strict
