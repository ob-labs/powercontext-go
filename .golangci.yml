version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - durationcheck
    - errcheck
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
    - wastedassign
    - whitespace
  settings:
    gocyclo:
      min-complexity: 50
    govet:
      enable:
        - shadow
    revive:
      # Keep only rules that add focused signal beyond govet and staticcheck.
      # Declaring the rule set explicitly also avoids the high-noise defaults.
      confidence: 0.8
      rules:
        - name: blank-imports
        - name: context-as-argument
          arguments:
            - allow-types-before: "*testing.T"
        - name: identical-branches
        - name: identical-ifelseif-branches
        - name: identical-ifelseif-conditions
        - name: identical-switch-branches
        - name: identical-switch-conditions
        - name: inefficient-map-lookup
        - name: redundant-build-tag
        - name: redundant-test-main-exit
        - name: unconditional-recursion
    staticcheck:
      checks:
        - all
        # Domain and CLI errors deliberately preserve their user-facing names.
        - -ST1005
        # Type spelling and quick-fix suggestions are style-only churn.
        - -ST1023
        - -QF*
  exclusions:
    # All generated Go output is under these checked-in paths. Keep the
    # exclusion path-scoped so a generated marker elsewhere cannot suppress
    # lint for an owned package.
    generated: disable
    paths:
      - ^api/v1/
      - ^client/invoker_gen\.go$
      - ^internal/mcpapi/schemas_gen\.go$
    warn-unused: true
    rules:
      # Scheduler: the pickle compatibility parser branches by supported opcode.
      # Remove this waiver when parsePickle is reduced below the threshold.
      - path: ^internal/scheduler/pickle\.go$
        linters:
          - gocyclo
        text: 'cyclomatic complexity 107 of func `parsePickle` is high \(> 50\)'

      # Server: process configuration validation covers the complete option matrix.
      # Remove this waiver when ProcessConfig.Validate is reduced below the threshold.
      - path: ^server/config_validate\.go$
        linters:
          - gocyclo
        text: 'cyclomatic complexity 62 of func `\(ProcessConfig\)\.Validate` is high \(> 50\)'

      # End-to-end tests: this vertical slice intentionally verifies the full memory lifecycle.
      # Remove this waiver when the scenario is split into functions below the threshold.
      - path: ^test/e2e/http_memory_test\.go$
        linters:
          - gocyclo
        text: 'cyclomatic complexity 206 of func `TestHTTPSourceAndMemorySQLiteVerticalSlice` is high \(> 50\)'

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ob-labs/powercontext-go
  exclusions:
    generated: disable
    paths:
      - ^api/v1/
      - ^client/invoker_gen\.go$
      - ^internal/mcpapi/schemas_gen\.go$
