name: Setup Go environment
description: Set up the repository Go toolchain and verify the locked module graph

inputs:
  go-version-file:
    description: Go module file that declares the required toolchain
    required: false
    default: go.mod
  cache-dependency-path:
    description: Module checksum files used as the setup-go cache key
    required: false
    default: go.sum

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: true
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    - name: Verify locked modules
      shell: bash
      run: |
        go mod download
        go mod verify

    - name: Restore repository-local tools
      uses: ./.github/actions/setup-tools

    - name: Set up Python for cross-language Go tests
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.12"

    - name: Set up uv for cross-language Go tests
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.10.12"
        enable-cache: true
