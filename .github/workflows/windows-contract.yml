name: Windows contract checkout

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: windows-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-contract:
    name: windows-contract
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out with repository attributes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up the Go environment
        uses: ./.github/actions/setup-go-env

      - name: Verify API baseline replacement on Windows
        run: go test -count=1 ./tools/api-baseline -run '^TestWriteBaselineReplacesExistingOutput$'

      - name: Verify Windows Task Scheduler executor boundary
        run: go test -count=1 ./internal/personalsvchost/windows

      - name: Verify Windows archive build date normalization
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\test\release\windows-archive-consumer.ps1 `
            -BuildInfoJSON '{"build_date":"2026-09-09T15:24:41Z"}' `
            -ExpectedBuildDate '2026-09-09T15:24:41Z'
          try {
            .\test\release\windows-archive-consumer.ps1 `
              -BuildInfoJSON '{"build_date":"2026-09-09T15:24:41Z"}' `
              -ExpectedBuildDate '2026-09-09T15:24:42Z'
            throw 'Windows archive metadata accepted a mismatched UTC instant'
          } catch {
            if ($_.Exception.Message -notlike '*does not match the expected UTC instant*') {
              throw
            }
          }

      - name: Stage locked SQLite headers for Windows archive consumption
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $moduleCache = (& go env GOMODCACHE).Trim()
          $source = Join-Path $moduleCache 'github.com\mattn\go-sqlite3@v1.14.33\sqlite3-binding.h'
          if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
            throw 'locked go-sqlite3 header is unavailable'
          }
          $headers = Join-Path $env:RUNNER_TEMP 'powercontext-sqlite-header-v1.14.33'
          New-Item -ItemType Directory -Force -Path $headers | Out-Null
          Copy-Item -LiteralPath $source -Destination (Join-Path $headers 'sqlite3.h') -Force

      - name: Install the pinned SBOM generator for Windows archive consumption
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& go run ./tools/release asset -component syft -field version).Trim()
          $tools = Join-Path $env:RUNNER_TEMP 'tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $env:GOBIN = $tools
          & go install "github.com/anchore/syft/cmd/syft@v$version"
          if ($LASTEXITCODE -ne 0) {
            throw "install pinned Syft $version failed"
          }

      - name: Verify Windows release archive personal server lifecycle
        shell: pwsh
        env:
          CGO_CPPFLAGS: -I${{ runner.temp }}\powercontext-sqlite-header-v1.14.33
          POWERCONTEXT_WINDOWS_RELEASE_CONSUMER_SYFT: ${{ runner.temp }}\tools\syft.exe
        run: |
          $ErrorActionPreference = 'Stop'
          .\test\release\windows-archive-consumer.ps1 -Syft $env:POWERCONTEXT_WINDOWS_RELEASE_CONSUMER_SYFT

      - name: Verify LF attributes and frozen fixture hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $textPaths = @(
            '.gitattributes',
            'Makefile',
            'go.mod',
            'go.sum',
            'openapi/powercontext.yaml',
            'api/v1/oas_client_gen.go',
            'client/invoker_gen.go',
            'internal/mcpapi/schemas_gen.go',
            'test/conformance/parity-contract.json',
            'test/conformance/parity-inventory-rules.json',
            'test/conformance/parity-inventory.json',
            'test/conformance/target-delta.json',
            'test/conformance/testdata/python-v0.0.2/manifest.json',
            'test/conformance/testdata/python-v0.1.0/manifest.json',
            'artifact/memory/prompts/conversation.txt',
            'test/release/windows-archive-consumer.ps1',
            'evaluation/tests/contract/fixtures/swebench_pro_public_v2.jsonl'
          )
          foreach ($path in $textPaths) {
            $attribute = git check-attr eol -- $path
            if ($attribute -ne "${path}: eol: lf") {
              throw "expected LF checkout attribute for $path; got $attribute"
            }
            $bytes = [IO.File]::ReadAllBytes($path)
            if ([Array]::IndexOf($bytes, [byte]13) -ge 0) {
              throw "expected LF checkout bytes for $path"
            }
          }

          foreach ($manifestPath in @(
            'test/conformance/testdata/python-v0.0.2/manifest.json',
            'test/conformance/testdata/python-v0.1.0/manifest.json'
          )) {
            $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
            foreach ($property in $manifest.fixture_sha256.PSObject.Properties) {
              $path = Join-Path (Split-Path $manifestPath) $property.Name
              $actual = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
              if ($actual -ne $property.Value) {
                throw "frozen fixture SHA-256 mismatch for $manifestPath/$($property.Name): got $actual, want $($property.Value)"
              }
            }
          }

          $contractPaths = @(
            '.gitattributes',
            'Makefile',
            'go.mod',
            'go.sum',
            'openapi',
            'api/v1',
            'client/invoker_gen.go',
            'internal/mcpapi/schemas_gen.go',
            'test/conformance/parity-contract.json',
            'test/conformance/parity-inventory-rules.json',
            'test/conformance/parity-inventory.json',
            'test/conformance/target-delta.json',
            'test/conformance/testdata/python-v0.0.2',
            'test/conformance/testdata/python-v0.1.0'
          )
          & git diff --exit-code -- @contractPaths
