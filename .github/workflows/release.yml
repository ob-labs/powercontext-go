name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  prepare:
    name: Freeze release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build_date: ${{ steps.release.outputs.build_date }}
      commit: ${{ steps.release.outputs.commit }}
      image_tag: ${{ steps.release.outputs.image_tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Resolve and validate immutable release metadata
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#powercontext-v}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must use vX.Y.Z, powercontext-vX.Y.Z, or X.Y.Z semantic versioning" >&2
            exit 2
          fi
          test "${#version}" -le 80
          commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          epoch="$(git show -s --format=%ct "$commit")"
          build_date="$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)"
          image_tag="${version//+/-}"
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "build_date=$build_date"
            echo "image_tag=$image_tag"
          } >> "$GITHUB_OUTPUT"

  binaries:
    name: Binary archives (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Check out the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up the Go environment
        uses: ./.github/actions/setup-go-env

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "10.34.5"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: integrations/dsh/plugins/powercontext/pnpm-lock.yaml

      - name: Verify the native release target
        id: platform
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          target="$(go env GOOS)-$(go env GOARCH)"
          test "$target" = "$EXPECTED_TARGET"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Build the DSH runtime adapter
        working-directory: integrations/dsh/plugins/powercontext
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Acquire verified native release assets
        id: native
        uses: ./.github/actions/setup-native-assets
        with:
          target: ${{ matrix.target }}
          include-onnxruntime: "true"

      - name: Install the pinned SBOM generator
        run: |
          version="$(go run ./tools/release asset -component syft -field version)"
          mkdir -p "$RUNNER_TEMP/tools"
          GOBIN="$RUNNER_TEMP/tools" go install "github.com/anchore/syft/cmd/syft@v$version"

      - name: Build and package both editions
        env:
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          ONNXRUNTIME_LIB_DIR: ${{ steps.native.outputs.onnxruntime-lib-dir }}
          SYFT: ${{ runner.temp }}/tools/syft
          TOKENIZERS_LIB_DIR: ${{ steps.native.outputs.tokenizers-lib-dir }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          make package-standard
          make package-full

      - name: Smoke test both released process surfaces
        env:
          POWERCONTEXT_ONNXRUNTIME_LIBRARY_DIR: ${{ steps.native.outputs.onnxruntime-lib-dir }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          go run ./tools/process-smoke -binary bin/powercontext -version "$VERSION"
          go run ./tools/process-smoke -binary bin/powercontext-full -version "$VERSION"

      - name: Build the platform checksum manifest
        run: |
          go run ./tools/release checksum \
            -output "dist/SHA256SUMS-${{ steps.platform.outputs.target }}" \
            dist/*.tar.gz dist/*.spdx.json

      - name: Upload platform release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ steps.platform.outputs.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  images:
    name: Multi-platform OCI images
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up the Go environment
        uses: ./.github/actions/setup-go-env

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image names
        id: metadata
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          image_owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "standard=ghcr.io/$image_owner/powercontext:$IMAGE_TAG"
            echo "full=ghcr.io/$image_owner/powercontext-full:$IMAGE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push the standard image
        id: standard
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: powercontext
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.standard }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ needs.prepare.outputs.commit }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          cache-from: type=gha,scope=powercontext-standard
          cache-to: type=gha,mode=max,scope=powercontext-standard

      - name: Build and push the Full image
        id: full
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          target: powercontext-full
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.full }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ needs.prepare.outputs.commit }}
            BUILD_DATE=${{ needs.prepare.outputs.build_date }}
          cache-from: type=gha,scope=powercontext-full
          cache-to: type=gha,mode=max,scope=powercontext-full

      - name: Record immutable image digests
        env:
          FULL_DIGEST: ${{ steps.full.outputs.digest }}
          FULL_IMAGE: ${{ steps.metadata.outputs.full }}
          STANDARD_DIGEST: ${{ steps.standard.outputs.digest }}
          STANDARD_IMAGE: ${{ steps.metadata.outputs.standard }}
        run: |
          mkdir -p image-release
          jq -n \
            --arg standard "$STANDARD_IMAGE@$STANDARD_DIGEST" \
            --arg full "$FULL_IMAGE@$FULL_DIGEST" \
            '{schema_version: 1, sbom_attestations: true, images: {standard: $standard, full: $full}}' \
            > image-release/IMAGE-DIGESTS.json

      - name: Upload image digest manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-images
          path: image-release/IMAGE-DIGESTS.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach checksummed release assets
    needs: [prepare, binaries, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up the Go environment
        uses: ./.github/actions/setup-go-env

      - name: Download all release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Build the release-level checksum manifest
        run: |
          go run ./tools/release checksum -output dist/SHA256SUMS \
            dist/*.tar.gz dist/*.spdx.json dist/IMAGE-DIGESTS.json
          test "$(find dist -name '*.tar.gz' | wc -l | tr -d ' ')" = 8
          test "$(find dist -name '*.spdx.json' | wc -l | tr -d ' ')" = 8
          test "$(wc -l < dist/SHA256SUMS | tr -d ' ')" = 17

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/IMAGE-DIGESTS.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true

  release-verify:
    name: Verify the published release
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/release-verify.yml
    with:
      release_tag: ${{ github.event.release.tag_name }}

  deploy-docs:
    name: Deploy documentation
    needs: release-verify
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-docs.yml
