name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the environment
        uses: ./.github/actions/setup-go-env

      - name: Run the pinned lint policy
        run: make lint

  go-compat:
    name: go-compat
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsqlite3-dev

      - name: Set up the environment
        uses: ./.github/actions/setup-go-env

      - name: Build every package with readonly modules
        run: make build-all

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsqlite3-dev

      - name: Set up the environment
        uses: ./.github/actions/setup-go-env

      - name: Run race-enabled atomic coverage
        run: make coverage

      - name: Publish the coverage total
        if: always()
        shell: bash
        run: |
          if [[ -s coverage/summary.txt ]]; then
            {
              echo "### Go coverage"
              echo '```text'
              tail -n 1 coverage/summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload bounded coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-coverage-${{ github.sha }}
          path: |
            coverage/coverage.out
            coverage/summary.txt
          if-no-files-found: warn
          retention-days: 14

  license-dependencies:
    name: license-dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the environment
        uses: ./.github/actions/setup-go-env

      - name: Verify dependency license evidence
        run: make license-dependencies

      - name: Upload dependency license evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-licenses-${{ github.sha }}
          path: coverage/dependencies.json
          if-no-files-found: warn
          retention-days: 14

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the environment
        uses: ./.github/actions/setup-go-env

      - name: Run checks
        run: make check

      - name: Check OpenAPI contract
        run: make contract-test

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the environment
        uses: ./.github/actions/setup-go-env

      - name: Run unit tests
        run: make unit-test

      - name: Run end-to-end tests
        run: make e2e-test

  pi-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up project tools
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Test Pi package
        run: make pi-test

  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.12"
          enable-cache: true
          cache-dependency-glob: tools/docs/uv.lock

      - name: Set up the documentation environment
        run: make docs-sync

      - name: Check if documentation can be built
        run: make docs-test

  migration-assurance:
    name: Go migration assurance
    uses: ./.github/workflows/migration-gates.yml
