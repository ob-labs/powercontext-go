name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the environment
        uses: ./.github/actions/setup-go-env

      - name: Run the pinned lint policy
        run: make lint

  go-compat:
    name: go-compat
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsqlite3-dev

      - name: Set up the environment
        uses: ./.github/actions/setup-go-env

      - name: Build every package with readonly modules
        run: make build-all

  license-dependencies:
    name: license-dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsqlite3-dev

      - name: Set up the environment
        uses: ./.github/actions/setup-go-env

      - name: Verify dependency license evidence
        run: make license-dependencies

      - name: Upload dependency license evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-licenses-${{ github.sha }}
          path: coverage/dependencies.json
          if-no-files-found: warn
          retention-days: 14

  dependency-security:
    name: dependency-security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsqlite3-dev

      - name: Set up the environment
        uses: ./.github/actions/setup-go-env

      - name: Scan the standard Server dependency surface for known vulnerabilities
        run: make dependency-security

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review pull request dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime,development,unknown
          license-check: true
          vulnerability-check: true

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsqlite3-dev

      - name: Set up the environment
        uses: ./.github/actions/setup-go-env

      - name: Run race-enabled atomic coverage
        run: make coverage

      - name: Publish the coverage total
        if: always()
        shell: bash
        run: |
          if [[ -s coverage/summary.txt ]]; then
            {
              echo "### Go coverage"
              echo '```text'
              tail -n 1 coverage/summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload bounded coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-coverage-${{ github.sha }}
          path: |
            coverage/coverage.out
            coverage/summary.txt
          if-no-files-found: warn
          retention-days: 14

  governance-contract:
    name: governance-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the environment
        uses: ./.github/actions/setup-go-env

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title_pattern='^(build|ci|docs|feat|fix|perf|refactor|revert|security|style|test)(\([a-z0-9][a-z0-9._/-]*\))?:[[:space:]]+.+$'
          if ! [[ "$PR_TITLE" =~ $title_pattern ]]; then
            echo "pull request title must use type(scope optional): summary" >&2
            exit 1
          fi

      - name: Check contribution and review contracts
        run: make governance-check

  release-contract:
    name: release-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the environment
        uses: ./.github/actions/setup-go-env

      - name: Check first-release governance and upstream metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          make governance-check
          make release-contract-check

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the environment
        uses: ./.github/actions/setup-go-env

      - name: Run checks
        run: make check

      - name: Check OpenAPI contract
        run: make contract-test

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the environment
        uses: ./.github/actions/setup-go-env

      - name: Run unit tests
        run: make unit-test

      - name: Run end-to-end tests
        id: end_to_end_tests
        env:
          PROCESS_SMOKE_FAILURE_DIAGNOSTICS: ${{ runner.temp }}/powercontext-process-diagnostics/report.txt
        run: make e2e-test

      - name: Write bounded process diagnostics
        if: always()
        shell: bash
        env:
          E2E_TESTS_OUTCOME: ${{ steps.end_to_end_tests.outcome }}
        run: |
          diagnostics="$RUNNER_TEMP/powercontext-process-diagnostics"
          mkdir -p "$diagnostics"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'e2e_tests_outcome=%s\n' "$E2E_TESTS_OUTCOME"
            if test -f "$diagnostics/report.txt"; then
              sha256sum "$diagnostics/report.txt"
            else
              printf 'process_smoke_report=not-created\n'
            fi
          } > "$diagnostics/summary.txt"

      - name: Upload process diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: process-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/powercontext-process-diagnostics/summary.txt
            ${{ runner.temp }}/powercontext-process-diagnostics/report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Verify repository cleanliness after test execution
        if: always()
        shell: bash
        run: |
          status="$(git status --porcelain)"
          if test -n "$status"; then
            count="$(printf '%s\n' "$status" | wc -l | tr -d '[:space:]')"
            printf '%s\n' "$status" | sed -n '1,100p'
            if test "$count" -gt 100; then
              printf '... %s additional paths omitted\n' "$((count - 100))"
            fi
            exit 1
          fi

  pi-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up project tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Test Pi package
        run: make pi-test

  check-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.12"
          enable-cache: true
          cache-dependency-glob: tools/docs/uv.lock

      - name: Set up the documentation environment
        run: make docs-sync

      - name: Check if documentation can be built
        run: make docs-test

  migration-assurance:
    name: Go migration assurance
    uses: ./.github/workflows/migration-gates.yml
