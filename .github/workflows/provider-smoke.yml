name: Provider smoke

on:
  workflow_dispatch:
    inputs:
      generation_model:
        description: "Optional Pydantic AI-style generation model ID"
        required: false
        type: string
      embedding_model:
        description: "Optional Pydantic AI-style embedding model ID"
        required: false
        type: string
      embedding_dimension:
        description: "Positive output dimension supported by the selected embedding model"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provider-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  real-provider:
    name: Credentialed provider request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: provider-smoke
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the Go environment
        uses: ./.github/actions/setup-go-env

      - name: Make one bounded real request
        env:
          POWERCONTEXT_REAL_SMOKE_GENERATION_MODEL: ${{ inputs.generation_model }}
          POWERCONTEXT_REAL_SMOKE_EMBEDDING_MODEL: ${{ inputs.embedding_model }}
          POWERCONTEXT_REAL_SMOKE_EMBEDDING_DIMENSION: ${{ inputs.embedding_dimension }}
          ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CO_API_KEY: ${{ secrets.CO_API_KEY }}
          CRUSOE_API_KEY: ${{ secrets.CRUSOE_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_API_KEY: ${{ secrets.PROVIDER_GITHUB_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HEROKU_INFERENCE_KEY: ${{ secrets.HEROKU_INFERENCE_KEY }}
          HEROKU_INFERENCE_URL: ${{ secrets.HEROKU_INFERENCE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOTAI_API_KEY: ${{ secrets.MOONSHOTAI_API_KEY }}
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_VERSION: ${{ secrets.OPENAI_API_VERSION }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OVHCLOUD_API_KEY: ${{ secrets.OVHCLOUD_API_KEY }}
          PAIG_API_KEY: ${{ secrets.PAIG_API_KEY }}
          PAIG_BASE_URL: ${{ secrets.PAIG_BASE_URL }}
          PYDANTIC_AI_GATEWAY_API_KEY: ${{ secrets.PYDANTIC_AI_GATEWAY_API_KEY }}
          PYDANTIC_AI_GATEWAY_BASE_URL: ${{ secrets.PYDANTIC_AI_GATEWAY_BASE_URL }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_TOKEN: ${{ secrets.SNOWFLAKE_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          VERCEL_AI_GATEWAY_API_KEY: ${{ secrets.VERCEL_AI_GATEWAY_API_KEY }}
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          test -n "$POWERCONTEXT_REAL_SMOKE_GENERATION_MODEL$POWERCONTEXT_REAL_SMOKE_EMBEDDING_MODEL"
          go test -count=1 -run '^TestRealProviderSmoke$' ./internal/modelprovider
