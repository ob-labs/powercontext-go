name: Go migration assurance

on:
  workflow_call:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  quality:
    name: Contract, fuzz, and module integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the Go environment
        uses: ./.github/actions/setup-go-env

      - name: Lint GitHub Actions workflows
        run: make actionlint

      - name: Verify generated contracts
        run: make check-generated

      - name: Verify owned Go module integrity
        run: make module-integrity

      - name: Verify formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Fuzz high-risk parsers and byte boundaries
        run: |
          go test -run '^$' -fuzz '^FuzzMarshalCanonicalJSONIsIdempotent$' -fuzztime=3s ./internal/jcs
          go test -run '^$' -fuzz '^FuzzRestrictedPickleJobDecoder$' -fuzztime=3s ./internal/scheduler
          go test -run '^$' -fuzz '^FuzzAgentSkillFrontmatterParser$' -fuzztime=3s ./artifact/skill
          go test -run '^$' -fuzz '^FuzzTruncateUTF8PreservesRuneBoundariesAndBudget$' -fuzztime=3s ./internal/contextpack
          go test -run '^$' -fuzz '^FuzzValidJSONUnicodeNeverPanics$' -fuzztime=3s ./internal/httpapi

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build the standard Docker image
        run: docker build --pull --target powercontext -t powercontext:ci .

      - name: Verify repository cleanliness after quality checks
        if: always()
        shell: bash
        run: |
          status="$(git status --porcelain)"
          if test -n "$status"; then
            count="$(printf '%s\n' "$status" | wc -l | tr -d '[:space:]')"
            printf '%s\n' "$status" | sed -n '1,100p'
            if test "$count" -gt 100; then
              printf '... %s additional paths omitted\n' "$((count - 100))"
            fi
            exit 1
          fi

  race-debt:
    name: Race debt
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the Go environment
        uses: ./.github/actions/setup-go-env

      - name: Reject new temporary race exclusions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          baseline="$RUNNER_TEMP/race-debt-base.json"
          git show "$BASE_SHA:.github/race-debt.json" > "$baseline"
          make race-debt-check RACE_DEBT_BASELINE="$baseline"

      - name: Validate the race-debt ledger
        run: make race-debt-check

      - name: Run all Go tests with the race detector
        run: make test-race

  race-debt-functional:
    name: Race debt functional coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the Go environment
        uses: ./.github/actions/setup-go-env

      - name: Exercise temporary exclusions without the race detector
        run: make race-debt-functional

  portable-sdk:
    name: Portable SDK cross-builds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the Go environment
        uses: ./.github/actions/setup-go-env

      - name: Cross-build public packages with CGO disabled
        run: make check-portable

  downstream-compat:
    name: Downstream public consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the Go environment
        uses: ./.github/actions/setup-go-env

      - name: Build and exercise the isolated consumer
        run: make downstream-compat

  generated-consumers:
    name: Generated consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the Go environment
        uses: ./.github/actions/setup-go-env

      - name: Generate and test fresh Go consumers
        run: make generated-consumers

      - name: Verify repository cleanliness after fresh consumer checks
        if: always()
        shell: bash
        run: |
          status="$(git status --porcelain)"
          if test -n "$status"; then
            count="$(printf '%s\n' "$status" | wc -l | tr -d '[:space:]')"
            printf '%s\n' "$status" | sed -n '1,100p'
            if test "$count" -gt 100; then
              printf '... %s additional paths omitted\n' "$((count - 100))"
            fi
            exit 1
          fi

  api-compat:
    name: Public API compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install SQLite development headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsqlite3-dev

      - name: Set up the Go environment
        uses: ./.github/actions/setup-go-env

      - name: Compare deliberate public packages with the approved baseline
        run: make api-compat

  frozen-oracle:
    name: Frozen Python Oracle and differential fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Go implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out frozen Python Oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: oceanbase/powercontext
          ref: 3a6cb0151670eaff7dc0293466edd673124e80da
          path: _oracle

      - name: Verify Oracle identity
        run: test "$(git -C _oracle rev-parse HEAD)" = 3a6cb0151670eaff7dc0293466edd673124e80da

      - name: Check out the previous parity target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: oceanbase/powercontext
          ref: f2ec1f75e5e1b46ad0626ab8390801b88966b6f5
          path: _previous_target

      - name: Verify previous parity target identity
        run: test "$(git -C _previous_target rev-parse HEAD)" = f2ec1f75e5e1b46ad0626ab8390801b88966b6f5

      - name: Check out the active parity target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: oceanbase/powercontext
          ref: 7b736206a53a6de6f43d4b517893ee1a80e7183d
          path: _target

      - name: Verify parity target identity
        run: test "$(git -C _target rev-parse HEAD)" = 7b736206a53a6de6f43d4b517893ee1a80e7183d

      - name: Set up the Go environment
        uses: ./.github/actions/setup-go-env

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.12"
          enable-cache: true

      - name: Install the locked Oracle environment
        run: uv sync --project _oracle --locked --extra server

      - name: Run the frozen Python suite
        run: _oracle/.venv/bin/python -m pytest _oracle/tests

      - name: Regenerate and compare frozen fixtures
        run: |
          fixture_root="$RUNNER_TEMP/powercontext-oracle-fixtures"
          mkdir -p "$fixture_root"
          _oracle/.venv/bin/python test/conformance/python_oracle_fixture.py \
            generate "$fixture_root/authority.db" --snapshot "$fixture_root/authority-rows.json"
          _oracle/.venv/bin/python test/conformance/python_scheduler_fixture.py \
            generate "$fixture_root/scheduler.db"
          _oracle/.venv/bin/python test/conformance/python_domain_contract_fixture.py \
            "$fixture_root/domain-contract.json"
          _oracle/.venv/bin/python test/conformance/python_handoff_report_v002_fixture.py \
            "$fixture_root/handoff-report-digests.json"
          # SQLite headers record the writer library version. The committed
          # databases remain SHA-pinned; regeneration compares portable data.
          for name in authority-rows.json domain-contract.json handoff-report-digests.json; do
            cmp "$fixture_root/$name" "test/conformance/testdata/python-v0.0.2/$name"
          done
          _oracle/.venv/bin/python test/conformance/python_scheduler_fixture.py \
            compare "$fixture_root/scheduler.db" \
            --expected test/conformance/testdata/python-v0.0.2/scheduler.db
          # SQLite database bytes encode the writer's SQLite version and page
          # layout. The generator manifest must use the committed canonical
          # database bytes after the regenerated databases pass semantic checks.
          fixture_manifest_root="$RUNNER_TEMP/powercontext-oracle-fixture-manifest"
          mkdir -p "$fixture_manifest_root"
          for name in authority-rows.json domain-contract.json handoff-report-digests.json; do
            cp "$fixture_root/$name" "$fixture_manifest_root/$name"
          done
          for name in authority.db scheduler.db provider-matrix.json; do
            cp "test/conformance/testdata/python-v0.0.2/$name" "$fixture_manifest_root/$name"
          done
          go run ./tools/fixture-generate -python _oracle -output "$fixture_manifest_root/manifest.json"
          cmp "$fixture_manifest_root/manifest.json" "test/conformance/testdata/python-v0.0.2/manifest.json"
          parity_inventory="$RUNNER_TEMP/powercontext-parity-inventory.json"
          go run ./tools/parity-inventory-generate -upstream _target -output "$parity_inventory"
          cmp "$parity_inventory" "test/conformance/parity-inventory.json"
          go run ./tools/fixture-generate -python _oracle -check
          go run ./tools/traceability-generate -check
          go run ./tools/parity-inventory-generate \
            -upstream _target \
            -check \
            -check-delta \
            -previous-upstream _previous_target \
            -release-upstream _target

      - name: Run Python to Go to Python compatibility tests
        env:
          POWERCONTEXT_ORACLE_PYTHON: ${{ github.workspace }}/_oracle/.venv/bin/python
          POWERCONTEXT_APSCHEDULER_PYTHON: ${{ github.workspace }}/_oracle/.venv/bin/python
        run: go test -count=1 ./test/conformance ./internal/scheduler

      - name: Build the Go Server for black-box comparison
        run: make build VERSION=ci COMMIT=${{ github.sha }} BUILD_DATE=1970-01-01T00:00:00Z

      - name: Run the frozen Python versus Go HTTP differential
        run: |
          _oracle/.venv/bin/python test/differential/compare_servers.py \
            --python-executable _oracle/.venv/bin/powercontext \
            --python-cwd _oracle \
            --go-executable bin/powercontext \
            --go-cwd .

      - name: Write bounded frozen Oracle diagnostics
        if: always()
        shell: bash
        run: |
          diagnostics="$RUNNER_TEMP/powercontext-oracle-diagnostics"
          mkdir -p "$diagnostics"
          {
            printf 'oracle_commit='
            git -C _oracle rev-parse HEAD 2>/dev/null || printf 'unavailable'
            printf 'target_commit='
            git -C _target rev-parse HEAD 2>/dev/null || printf 'unavailable'
            for path in \
              "$RUNNER_TEMP/powercontext-oracle-fixtures/authority-rows.json" \
              "$RUNNER_TEMP/powercontext-oracle-fixtures/domain-contract.json" \
              "$RUNNER_TEMP/powercontext-oracle-fixtures/handoff-report-digests.json" \
              "$RUNNER_TEMP/powercontext-oracle-fixture-manifest/manifest.json" \
              "$RUNNER_TEMP/powercontext-parity-inventory.json"; do
              if test -f "$path"; then
                sha256sum "$path"
              fi
            done
            printf 'worktree_path_count='
            git status --porcelain | wc -l | tr -d '[:space:]'
          } > "$diagnostics/summary.txt"

      - name: Upload frozen Oracle diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frozen-oracle-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/powercontext-oracle-diagnostics/summary.txt
          if-no-files-found: error
          retention-days: 14

  oceanbase-live:
    name: OceanBase live compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      oceanbase:
        image: ghcr.io/oceanbase/oceanbase-ce@sha256:31086a6900c21c479c2bcd942b6a28c53b17a51f4e9b9eb8eafcc596adfcd2e3
        env:
          MODE: slim
          OB_DATABASE: powercontext
          OB_TENANT_PASSWORD: powercontext-e2e
        ports:
          - 2881:2881
        options: >-
          --ulimit nofile=65536:65536
          --health-cmd "obclient -h127.0.0.1 -P2881 -uroot@test -ppowercontext-e2e -Dpowercontext -e 'SELECT 1' >/dev/null 2>&1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 120
          --health-start-period 30s
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the Go environment
        uses: ./.github/actions/setup-go-env

      - name: Run real OceanBase schema and cursor tests
        env:
          POWERCONTEXT_TEST_OCEANBASE_URL: mysql+aoceanbase://root%40test:powercontext-e2e@127.0.0.1:2881/powercontext?charset=utf8mb4
        run: make test-oceanbase-live

  platform:
    name: Standard (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the Go environment
        uses: ./.github/actions/setup-go-env

      - name: Verify native target
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: test "$(go env GOOS)-$(go env GOARCH)" = "$EXPECTED_TARGET"

      - name: Test SQLite and build the CGO binary
        run: |
          make test-sqlite
          make smoke VERSION=ci COMMIT=${{ github.sha }} BUILD_DATE=1970-01-01T00:00:00Z

  full:
    name: Full build tags (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up the Go environment
        uses: ./.github/actions/setup-go-env

      - name: Set up the verified native tokenizer
        id: native
        uses: ./.github/actions/setup-native-assets
        with:
          target: ${{ matrix.target }}

      - name: Test and build the Full binary
        env:
          TOKENIZERS_LIB_DIR: ${{ steps.native.outputs.tokenizers-lib-dir }}
        run: |
          make test-full
          make smoke-full VERSION=ci COMMIT=${{ github.sha }} BUILD_DATE=1970-01-01T00:00:00Z

  host-adapters:
    name: Host adapters
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up Go for the DSH call-through test
        uses: ./.github/actions/setup-go-env

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.12"
          enable-cache: true

      - name: Test Python host adapters
        run: |
          uv run --project integrations/codex/plugins/powercontext --locked --with pytest \
            pytest integrations/codex/tests
          uv run --project integrations/bub --locked --with pytest pytest integrations/bub/tests
          uv run --with pytest pytest integrations/claude-code/tests
          uv run --with pytest --with pydantic --with httpx pytest integrations/hermes/tests
          uv run --project integrations/langgraph --locked --with pytest pytest integrations/langgraph/tests
          uv run --with pytest pytest integrations/workbuddy/tests

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "10.34.5"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            integrations/dsh/plugins/powercontext/pnpm-lock.yaml
            integrations/pi/plugins/powercontext/pnpm-lock.yaml
            integrations/opencode/plugins/powercontext/pnpm-lock.yaml
            integrations/openclaw/plugins/memory-powercontext/pnpm-lock.yaml

      - name: Build the PowerContext Server for DSH end-to-end tests
        run: go build -tags sqlite_fts5 -o "$RUNNER_TEMP/powercontext-dsh-e2e" ./cmd/powercontext

      - name: Test and rebuild the DSH adapter
        working-directory: integrations/dsh/plugins/powercontext
        env:
          POWERCONTEXT_GO_BINARY: ${{ runner.temp }}/powercontext-dsh-e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm run gen:check
          pnpm test
          pnpm run test:e2e
          pnpm build
          git diff --exit-code -- src/operations.generated.ts lib

      - name: Test the Pi adapter
        working-directory: integrations/pi/plugins/powercontext
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test

      - name: Test and rebuild the OpenCode adapter
        working-directory: integrations/opencode/plugins/powercontext
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
          git diff --exit-code -- lib

      - name: Test and rebuild the OpenClaw adapter
        working-directory: integrations/openclaw/plugins/memory-powercontext
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
          git diff --exit-code -- dist

  evaluation:
    name: Evaluation control plane and console
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.10.12"
          enable-cache: true

      - name: Test and type-check the evaluation control plane
        run: |
          uv sync --project evaluation --locked
          uv run --project evaluation pytest -c evaluation/pyproject.toml evaluation/tests -m "not live" -q
          uv run --project evaluation ruff check evaluation
          uv run --project evaluation ruff format --check evaluation
          uv run --directory evaluation ty check src

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: evaluation/web/package-lock.json

      - name: Test and build the evaluation console
        working-directory: evaluation/web
        run: |
          npm ci
          npm test -- --run
          npm run build
