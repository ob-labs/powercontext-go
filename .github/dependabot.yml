version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/test/downstream"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 4
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 4
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "uv"
    directories:
      - "/evaluation"
      - "/integrations/bub"
      - "/integrations/codex/plugins/powercontext"
      - "/integrations/langchain"
      - "/integrations/langgraph"
      - "/integrations/pydantic-ai"
      - "/tools/docs"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 4
    groups:
      uv-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directories:
      - "/evaluation/web"
      - "/integrations/dsh/plugins/powercontext"
      - "/integrations/openclaw/plugins/memory-powercontext"
      - "/integrations/opencode/plugins/powercontext"
      - "/integrations/pi/plugins/powercontext"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 4
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 4
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
